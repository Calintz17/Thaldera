name: Codex integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check assets/app.js
      - name: Test navigation and map inventory
        run: node tests/navigation.test.cjs
      - name: Check entity and relation integrity
        run: python3 tools/check_data.py
      - name: Audit images, positions and structure
        run: python3 tools/audit_assets.py
      - name: Report narrative repetition candidates
        run: python3 tools/audit_repetitions.py

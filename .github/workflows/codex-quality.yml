name: Codex quality checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check assets/app.js
      - name: Verify codex references
        run: python3 tools/check_data.py
      - name: Audit assets and cartographic coordinates
        run: python3 tools/audit_assets.py

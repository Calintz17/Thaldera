<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thaldera Codex</title>
  <meta name="description" content="Le codex des joueurs de la campagne Thaldera : cartes, lieux, personnages et liens.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Roboto+Slab:wght@900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/codex.css?v=50">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Thaldera Codex, accueil">
    <span class="brand-name">Thaldera</span>
    <span class="brand-codex">Codex</span>
  </a>
  <div class="search">
    <input id="q" type="search" placeholder="Rechercher un lieu, un personnage, un clan" autocomplete="off" spellcheck="false">
    <div id="results" role="listbox" hidden></div>
  </div>
  <nav class="nav">
    <a href="#/" data-nav="monde">Monde</a>
    <a href="factions/">Factions</a>
    <button type="button" id="rbtn" class="qbtn" aria-haspopup="dialog" aria-expanded="false">Runes de Philippa</button>
    <button type="button" id="qbtn" class="qbtn" aria-haspopup="dialog" aria-expanded="false">Quêtes</button>
  </nav>
</header>

<main id="scene" class="scene is-world">
  <section id="world" class="world" aria-label="Le monde connu"></section>
  <section id="stage" class="stage" aria-label="Carte"></section>
  <aside id="panel" class="panel"></aside>
</main>

<div id="qlog" class="qlog" role="dialog" aria-label="Journal de quêtes" hidden></div>
<div id="rlog" class="qlog" role="dialog" aria-label="Runes de Philippa" hidden></div>

<noscript><p style="padding:2rem">Le codex demande JavaScript.</p></noscript>
<script src="assets/app.js?v=50"></script>
</body>
</html>

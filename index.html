<body>
<header class="top">

    <button type="button" id="qbtn" class="qbtn" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h11a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H8a4 4 0 0 1-4-4V7a3 3 0 0 1 3-3z"/><path d="M7 4a3 3 0 0 1 3 3v9a2 2 0 1 1-4 0m6-6h6m-6 4h6"/></svg><span>Quêtes</span></button>

<main id="scene" class="scene is-world">

  <section id="stage" class="stage" aria-label="Carte"></section>
  <aside id="panel" class="panel"></aside>
</main>

<div id="elog" class="elog" role="dialog" aria-modal="true" aria-label="Explorer le codex" hidden></div>
<div id="qlog" class="qlog" role="dialog" aria-label="Journal de quêtes" hidden></div>
